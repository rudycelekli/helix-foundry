        \ TABLE proof_other.parent(id text PRIMARY KEY);\n    CREATE TABLE proof_other.child(id\
        \ text PRIMARY KEY, parent_id text,\n      CONSTRAINT shared_fk FOREIGN KEY(parent_id)\
        \ REFERENCES proof_other.parent(id));\n    CREATE TABLE proof_edges.hidden_origin(id\
        \ text PRIMARY KEY, parent_id text REFERENCES proof_edges.solo(id));\n   \
        \ CREATE TABLE proof_edges.hidden_target(id text PRIMARY KEY);\n    CREATE\
        \ TABLE proof_edges.visible_child(id text PRIMARY KEY, secret_ref text REFERENCES\
        \ proof_edges.hidden_target(id));\n    GRANT USAGE ON SCHEMA proof_edges,proof_other\
        \ TO foundry_readonly;\n    GRANT SELECT ON proof_edges.parent,proof_edges.child,proof_edges.solo,proof_edges.second,\n\
        \      proof_other.parent,proof_other.child,proof_edges.visible_child TO foundry_readonly;`);\n\
        });\nafterAll(async () => { await admin.end(); });\nconst edge = (table_name:\
        \ string, column_name: string, referenced_table: string, referenced_column:\
        \ string, table_schema = \"proof_edges\", referenced_schema = \"proof_edges\"\
        ) => ({table_schema,table_name,column_name,referenced_schema,referenced_table,referenced_column});\n\
        const composite = [edge(\"child\",\"owner_tenant\",\"parent\",\"tenant\"),edge(\"\
        child\",\"owner_id\",\"parent\",\"id\")];\n\ndescribe(\"owned Postgres read-only\
