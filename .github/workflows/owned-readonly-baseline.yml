        print('Complete untracked list:',untracked)\nassert untracked==['tests/postgres-discovery.test.ts'],untracked\n\
        assert hashlib.sha256(pathlib.Path('tests/postgres-discovery.test.ts').read_bytes()).hexdigest()==\"\
        f4f61fcd54b99d5ac99fa41bee94dbaa520861541c5316218a53fc093c0678f6\"\nprint('All\
        \ other tracked hashes unchanged; exact reviewed source/test identities preserved.')\n\
