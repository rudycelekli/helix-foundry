name: Owned Helix Postgres candidate qualification
'on':
  push:
    branches:
    - validation/helix-readonly-candidate-20261021
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: proof
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d proof" --health-interval
          5s --health-timeout 5s --health-retries 12
    steps:
    - uses: actions/checkout@v4
      with:
        repository: HelixDB/helix-foundry
        ref: 00d7927d7c08e16c58316e006959f052427e7fa1
        persist-credentials: false
        fetch-depth: 1
    - name: Record exact source and runtime
      run: 'test "$(git rev-parse HEAD)" = "00d7927d7c08e16c58316e006959f052427e7fa1"

        git status --porcelain

        sha256sum pnpm-lock.yaml

        cat /etc/os-release

        echo "$ImageOS $ImageVersion"

        docker inspect "${{ job.services.postgres.id }}" --format ''{{.Image}}''

        python3 - <<''MANIFEST''

        import subprocess,hashlib,json,os,pathlib

        files=subprocess.check_output(["git","ls-files","-z"]).decode().split("\0")

        m={f:hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest() for f in files
        if f and pathlib.Path(f).is_file()}

        pathlib.Path(os.environ["RUNNER_TEMP"],"helix-tracked-before.json").write_text(json.dumps(m,sort_keys=True))

        MANIFEST'
      shell: bash
    - uses: pnpm/action-setup@v4
      with:
        version: 10.7.0
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: pnpm
    - run: 'node --version

        pnpm --version

        pnpm install --frozen-lockfile

        pnpm build:sdk'
      shell: bash
    - name: Apply reviewed apps/api/src/connectors.ts
      run: "cat > apps/api/src/connectors.ts <<'REVIEWED_EOF'\nimport mysql from \"\
        mysql2\";\nimport pg from \"pg\";\nimport {\n  S3Client,\n  ListObjectsV2Command,\n\
        \  GetObjectCommand,\n} from \"@aws-sdk/client-s3\";\nimport { createWriteStream\
        \ } from \"node:fs\";\nimport { mkdir, rm } from \"node:fs/promises\";\nimport\
        \ { pipeline, finished } from \"node:stream/promises\";\nimport { once } from\
        \ \"node:events\";\nimport { resolve } from \"node:path\";\nimport { randomUUID\
        \ } from \"node:crypto\";\nimport { config } from \"./config.js\";\nimport\
        \ { assert } from \"./security.js\";\nimport { postgresPoolConfig } from \"\
        ./postgres-config.js\";\nimport { discoverStripe, importStripe } from \"./stripe.js\"\
        ;\nimport { discoverWorkos, importWorkos } from \"./workos.js\";\nimport {\
        \ discoverPosthog, importPosthog } from \"./posthog.js\";\nimport { discoverNeo4j,\
        \ importNeo4j } from \"./neo4j.js\";\nexport type ConnectorConfig = Record<string,\
        \ any>;\nfunction mysqlPool(c: ConnectorConfig) {\n  return mysql.createPool({\n\
        \    host: c.host,\n    port: Number(c.port || 3306),\n    user: c.user,\n\
        \    password: c.password,\n    database: c.database,\n    connectionLimit:\
        \ 2,\n    connectTimeout: 10000,\n    supportBigNumbers: true,\n    bigNumberStrings:\
        \ true,\n    decimalNumbers: false,\n    dateStrings: true,\n    ssl: c.tls\n\
        \      ? { rejectUnauthorized: true, ...(c.ca ? { ca: c.ca } : {}) }\n   \
        \   : undefined,\n  });\n}\nfunction pgPool(c: ConnectorConfig) {\n  return\
        \ new pg.Pool(postgresPoolConfig(c));\n}\nconst identifier = (s: string, kind:\
        \ string) =>\n  kind === \"mysql\"\n    ? \"`\" + s.replaceAll(\"`\", \"``\"\
        ) + \"`\"\n    : '\"' + s.replaceAll('\"', '\"\"') + '\"';\nconst s3 = (c:\
        \ ConnectorConfig) =>\n  new S3Client({\n    region: c.region || \"us-east-1\"\
        ,\n    endpoint: c.endpoint || undefined,\n    forcePathStyle: !!c.endpoint,\n\
        \    credentials: c.accessKeyId\n      ? { accessKeyId: c.accessKeyId, secretAccessKey:\
        \ c.secretAccessKey }\n      : undefined,\n  });\nexport function checkedURL(value:\
        \ string) {\n  const u = new URL(value);\n  assert([\"http:\", \"https:\"\
        ].includes(u.protocol), \"Use an HTTP(S) URL\");\n  assert(\n    !u.username\
        \ && !u.password,\n    \"Use credential fields instead of URL credentials\"\
        ,\n  );\n  assert(\n    ![\n      \"169.254.169.254\",\n      \"metadata.google.internal\"\
        ,\n      \"100.100.100.200\",\n    ].includes(u.hostname),\n    \"Metadata\
        \ endpoints are not data sources\",\n  );\n  return u;\n}\nfunction headers(c:\
        \ ConnectorConfig) {\n  return c.token\n    ? {\n        [c.header || \"Authorization\"\
        ]: c.header\n          ? String(c.token)\n          : \"Bearer \" + c.token,\n\
        \      }\n    : {};\n}\nexport async function discover(kind: string, c: ConnectorConfig)\
        \ {\n  if (kind === \"mysql\") {\n    const pool = mysqlPool(c);\n    try\
        \ {\n      const [tables] = await pool\n        .promise()\n        .query(\n\
        \          \"SELECT TABLE_NAME name, TABLE_ROWS estimatedRows FROM information_schema.TABLES\
        \ WHERE TABLE_SCHEMA = ? AND TABLE_TYPE = ?\",\n          [c.database, \"\
        BASE TABLE\"],\n        );\n      const [keys] = await pool\n        .promise()\n\
        \        .query(\n          \"SELECT TABLE_NAME tableName, COLUMN_NAME columnName,\
        \ CONSTRAINT_NAME constraintName, REFERENCED_TABLE_NAME referencedTable, REFERENCED_COLUMN_NAME\
        \ referencedColumn FROM information_schema.KEY_COLUMN_USAGE WHERE TABLE_SCHEMA\
        \ = ?\",\n          [c.database],\n        );\n      const [databases] = await\
        \ pool\n        .promise()\n        .query(\"SELECT SCHEMA_NAME name FROM\
        \ information_schema.SCHEMATA\");\n      const [columns] = await pool\n  \
        \      .promise()\n        .query(\n          \"SELECT TABLE_NAME tableName,\
        \ COLUMN_NAME name, COLUMN_TYPE type, IS_NULLABLE nullable, COLUMN_DEFAULT\
        \ defaultValue FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = ? ORDER\
        \ BY TABLE_NAME, ORDINAL_POSITION\",\n          [c.database],\n        );\n\
        \      const [sample] = c.table\n        ? await pool\n            .promise()\n\
        \            .query(\"SELECT * FROM \" + identifier(c.table, kind) + \" LIMIT\
        \ 10\")\n        : [[]];\n      return { tables, keys, databases, columns,\
        \ sample };\n    } finally {\n      await pool.promise().end();\n    }\n \
        \ }\n  if (kind === \"postgres\") {\n    const pool = pgPool(c);\n    try\
        \ {\n      const tables = await pool.query(\n        \"SELECT table_schema\
        \ schema, table_name name FROM information_schema.tables WHERE table_schema\
        \ NOT IN ('pg_catalog','information_schema') AND table_type='BASE TABLE'\"\
        ,\n      );\n      // The schema lets each source keep only its own table's\
        \ keys.\n      const keys = await pool.query(\n        `SELECT n.nspname AS\
        \ table_schema, t.relname AS table_name,\n                a.attname AS column_name,\n\
        \                CASE k.contype WHEN 'p' THEN 'PRIMARY KEY' ELSE 'FOREIGN\
        \ KEY' END AS constraint_type\n         FROM pg_catalog.pg_constraint k\n\
        \         JOIN pg_catalog.pg_class t ON t.oid = k.conrelid\n         JOIN\
        \ pg_catalog.pg_namespace n ON n.oid = t.relnamespace\n         CROSS JOIN\
        \ LATERAL unnest(k.conkey) WITH ORDINALITY AS col(attnum, position)\n    \
        \     JOIN pg_catalog.pg_attribute a ON a.attrelid = t.oid AND a.attnum =\
        \ col.attnum\n         WHERE k.contype IN ('p', 'f') AND t.relkind IN ('r',\
        \ 'p')\n           AND n.nspname NOT IN ('pg_catalog', 'information_schema')\n\
        \           AND has_table_privilege(t.oid, 'SELECT')\n         ORDER BY n.nspname,\
        \ t.relname, k.oid, col.position`,\n      );\n      const columns = await\
        \ pool.query(\n        \"SELECT table_schema AS schema,table_name AS table_name,column_name\
        \ AS name,data_type AS type,is_nullable AS nullable FROM information_schema.columns\
        \ WHERE table_schema NOT IN ('pg_catalog','information_schema') ORDER BY table_schema,table_name,ordinal_position\"\
        ,\n      );\n      const foreignKeys = await pool.query(\n        `SELECT\
        \ n.nspname AS table_schema, t.relname AS table_name,\n                a.attname\
        \ AS column_name, rn.nspname AS referenced_schema,\n                rt.relname\
        \ AS referenced_table, ra.attname AS referenced_column\n         FROM pg_catalog.pg_constraint\
        \ k\n         JOIN pg_catalog.pg_class t ON t.oid = k.conrelid\n         JOIN\
        \ pg_catalog.pg_namespace n ON n.oid = t.relnamespace\n         JOIN pg_catalog.pg_class\
        \ rt ON rt.oid = k.confrelid\n         JOIN pg_catalog.pg_namespace rn ON\
        \ rn.oid = rt.relnamespace\n         CROSS JOIN LATERAL unnest(k.conkey, k.confkey)\
        \ WITH ORDINALITY AS col(attnum, refattnum, position)\n         JOIN pg_catalog.pg_attribute\
        \ a ON a.attrelid = t.oid AND a.attnum = col.attnum\n         JOIN pg_catalog.pg_attribute\
        \ ra ON ra.attrelid = rt.oid AND ra.attnum = col.refattnum\n         WHERE\
        \ k.contype = 'f' AND t.relkind IN ('r', 'p')\n           AND n.nspname NOT\
        \ IN ('pg_catalog', 'information_schema')\n           AND rn.nspname NOT IN\
        \ ('pg_catalog', 'information_schema')\n           AND has_table_privilege(t.oid,\
        \ 'SELECT')\n           AND has_table_privilege(rt.oid, 'SELECT')\n      \
        \   ORDER BY n.nspname, t.relname, k.oid, col.position`,\n      );\n     \
        \ const sample = c.table\n        ? (\n            await pool.query(\n   \
        \           \"SELECT * FROM \" +\n                identifier(c.schema || \"\
        public\", kind) +\n                \".\" +\n                identifier(c.table,\
        \ kind) +\n                \" LIMIT 10\",\n            )\n          ).rows\n\
        \        : [];\n      return {\n        tables: tables.rows,\n        keys:\
        \ keys.rows,\n        columns: columns.rows,\n        foreignKeys: foreignKeys.rows,\n\
        \        sample,\n      };\n    } finally {\n      await pool.end();\n   \
        \ }\n  }\n  if (kind === \"s3\") {\n    const client = s3(c);\n    try {\n\
        \      const tables: { name: string; size?: number }[] = [];\n      let cursor:\
        \ string | undefined;\n      const seen = new Set<string>();\n      do {\n\
        \        const r = await client.send(\n          new ListObjectsV2Command({\n\
        \            Bucket: c.bucket,\n            Prefix: c.prefix || \"\",\n  \
        \          MaxKeys: 1000,\n            ContinuationToken: cursor,\n      \
        \    }),\n        );\n        for (const item of r.Contents || [])\n     \
        \     if (item.Key && /\\.(csv|json|jsonl|parquet)$/i.test(item.Key))\n  \
        \          tables.push({ name: item.Key, size: item.Size });\n        cursor\
        \ = r.IsTruncated ? r.NextContinuationToken : undefined;\n        assert(\n\
        \          !r.IsTruncated || cursor,\n          \"Bucket listing was incomplete.\
        \ Try a narrower prefix.\",\n        );\n        if (cursor) {\n         \
        \ assert(\n            !seen.has(cursor),\n            \"Bucket listing repeated\
        \ a continuation token. Try a narrower prefix.\",\n          );\n        \
        \  seen.add(cursor);\n        }\n        assert(\n          tables.length\
        \ <= 10000,\n          \"More than 10,000 files found. Use a narrower prefix\
        \ to select files.\",\n        );\n      } while (cursor);\n      return {\
        \ tables };\n    } finally {\n      client.destroy();\n    }\n  }\n  if (kind\
        \ === \"stripe\") return discoverStripe(c);\n  if (kind === \"workos\") return\
        \ discoverWorkos(c);\n  if (kind === \"posthog\") return discoverPosthog(c);\n\
        \  if (kind === \"neo4j\") return discoverNeo4j(c);\n  if (kind === \"rest\"\
        ) {\n    const r = await fetch(checkedURL(c.url), {\n      headers: headers(c),\n\
        \      redirect: \"error\",\n      signal: AbortSignal.timeout(15000),\n \
        \   });\n    assert(r.ok, `Source returned HTTP ${r.status}`);\n    const\
        \ data = await r.json();\n    const rows = c.itemsPath ? atPath(data, c.itemsPath)\
        \ : data;\n    assert(Array.isArray(rows), \"REST items must be an array;\
        \ set itemsPath\");\n    return {\n      tables: [{ name: \"API response\"\
        , estimatedRows: rows.length }],\n      sample: rows.slice(0, 10),\n    };\n\
        \  }\n  return { tables: [] };\n}\nfunction atPath(value: any, path: string)\
        \ {\n  return path.split(\".\").reduce((v, k) => v?.[k], value);\n}\nexport\
        \ async function importSource(\n  scope: string,\n  kind: string,\n  c: ConnectorConfig,\n\
        \  progress?: (progress: {\n    message: string;\n    records?: number;\n\
        \    bytes?: number;\n  }) => Promise<unknown>,\n): Promise<{\n  file: string;\n\
        \  records: number;\n  schema?: { name: string; type: string }[];\n}> {\n\
        \  await mkdir(resolve(config.dataDir, \"incoming\", scope), { recursive:\
        \ true });\n  const ext =\n    kind === \"s3\"\n      ? String(c.key).split(\"\
        .\").at(-1)?.toLowerCase() || \"json\"\n      : \"jsonl\";\n  assert(\n  \
        \  [\"csv\", \"json\", \"jsonl\", \"parquet\"].includes(ext),\n    \"Choose\
        \ CSV, JSON, JSONL or Parquet\",\n  );\n  await progress?.({ message: \"Reading\
        \ complete snapshot\", records: 0 });\n  const file = randomUUID() + \".\"\
        \ + ext,\n    path = resolve(config.dataDir, \"incoming\", scope, file),\n\
        \    out = createWriteStream(path);\n  let count = 0;\n  let schema: { name:\
        \ string; type: string }[] | undefined;\n  let lastProgress = 0;\n  const\
        \ write = async (row: any) => {\n    if (Date.now() - lastProgress > 1000)\
        \ {\n      lastProgress = Date.now();\n      await progress?.({\n        message:\
        \ \"Reading complete snapshot\",\n        records: count,\n      });\n   \
        \ }\n    if (++count > 2_000_000)\n      throw new Error(\"Import limit is\
        \ two million records per snapshot\");\n    if (\n      !out.write(\n    \
        \    JSON.stringify(row, (_, v) =>\n          typeof v === \"bigint\" ? v.toString()\
        \ : v,\n        ) + \"\\n\",\n      )\n    )\n      await once(out, \"drain\"\
        );\n  };\n  try {\n    if (kind === \"mysql\") {\n      assert(c.table, \"\
        Select a table\");\n      const pool = mysqlPool(c);\n      try {\n      \
        \  const connection = await pool.promise().getConnection();\n        try {\n\
        \          const [columns] = await connection.query(\n            \"SELECT\
        \ COLUMN_NAME name,DATA_TYPE type FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=?\
        \ AND TABLE_NAME=? ORDER BY ORDINAL_POSITION\",\n            [c.database,\
        \ c.table],\n          );\n          schema = columns as { name: string; type:\
        \ string }[];\n          await connection.query(\n            \"SET TRANSACTION\
        \ ISOLATION LEVEL REPEATABLE READ\",\n          );\n          await connection.query(\"\
        START TRANSACTION READ ONLY\");\n          const stream = (\n            connection.connection\
        \ as unknown as mysql.PoolConnection\n          )\n            .query(\"SELECT\
        \ * FROM \" + identifier(c.table, kind))\n            .stream({ highWaterMark:\
        \ 100 });\n          const raw = connection.connection as any;\n         \
        \ const failed = (error: Error) => stream.destroy(error);\n          const\
        \ ended = () =>\n            stream.destroy(\n              new Error(\n \
        \               \"Source connection ended before the snapshot completed\"\
        ,\n              ),\n            );\n          raw.on(\"error\", failed);\n\
        \          raw.on(\"end\", ended);\n          const timer = setTimeout(\n\
        \            () =>\n              stream.destroy(new Error(\"Snapshot exceeded\
        \ import time limit\")),\n            Number(c.timeoutMs || 120000),\n   \
        \       );\n          try {\n            for await (const row of stream) await\
        \ write(row);\n          } finally {\n            clearTimeout(timer);\n \
        \           raw.off(\"error\", failed);\n            raw.off(\"end\", ended);\n\
        \          }\n          await connection.commit();\n        } finally {\n\
        \          connection.release();\n        }\n      } finally {\n        await\
        \ pool.promise().end();\n      }\n    } else if (kind === \"postgres\") {\n\
        \      assert(c.table, \"Select a table\");\n      const pool = pgPool(c);\n\
        \      let client: pg.PoolClient | undefined;\n      try {\n        client\
        \ = await pool.connect();\n        schema = (\n          await client.query(\n\
        \            \"SELECT column_name name,data_type type FROM information_schema.columns\
        \ WHERE table_schema=$1 AND table_name=$2 ORDER BY ordinal_position\",\n \
        \           [c.schema || \"public\", c.table],\n          )\n        ).rows;\n\
        \        await client.query(\"BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY\"\
        );\n        await client.query(\n          \"DECLARE foundry_cursor NO SCROLL\
        \ CURSOR FOR SELECT * FROM \" +\n            identifier(c.schema || \"public\"\
        , kind) +\n            \".\" +\n            identifier(c.table, kind),\n \
        \       );\n        while (true) {\n          const r = await client.query(\"\
        FETCH 1000 FROM foundry_cursor\");\n          if (!r.rows.length) break;\n\
        \          for (const row of r.rows) await write(row);\n        }\n      \
        \  await client.query(\"COMMIT\");\n      } finally {\n        client?.release();\n\
        \        await pool.end();\n      }\n    } else if (kind === \"rest\") {\n\
        \      let url = checkedURL(c.url),\n        page = 0,\n        seen = new\
        \ Set<string>();\n      if (c.pagination === \"offset\") {\n        url.searchParams.set(c.offsetParam\
        \ || \"offset\", \"0\");\n        url.searchParams.set(\n          c.limitParam\
        \ || \"limit\",\n          String(c.pageSize || 100),\n        );\n      }\n\
        \      while (page++ < 1000) {\n        assert(!seen.has(url.href), \"Pagination\
        \ repeated a URL\");\n        seen.add(url.href);\n        const response\
        \ = await fetch(url, {\n          headers: headers(c),\n          redirect:\
        \ \"error\",\n          signal: AbortSignal.timeout(30000),\n        });\n\
        \        assert(response.ok, `Source returned HTTP ${response.status}`);\n\
        \        const data = (await response.json()) as any,\n          rows = c.itemsPath\
        \ ? atPath(data, c.itemsPath) : data;\n        assert(Array.isArray(rows),\
        \ \"REST items must be an array\");\n        for (const row of rows) await\
        \ write(row);\n        if (c.pagination === \"next\" && atPath(data, c.nextPath\
        \ || \"next\")) {\n          const next = checkedURL(\n            new URL(atPath(data,\
        \ c.nextPath || \"next\"), url).href,\n          );\n          assert(\n \
        \           next.origin === url.origin,\n            \"Pagination must stay\
        \ on the configured origin\",\n          );\n          url = next;\n     \
        \   } else if (\n          c.pagination === \"cursor\" &&\n          atPath(data,\
        \ c.nextPath || \"next_cursor\")\n        ) {\n          url = new URL(url);\n\
        \          url.searchParams.set(\n            c.cursorParam || \"cursor\"\
        ,\n            String(atPath(data, c.nextPath || \"next_cursor\")),\n    \
        \      );\n        } else if (\n          c.pagination === \"offset\" &&\n\
        \          rows.length >= Number(c.pageSize || 100)\n        ) {\n       \
        \   url = new URL(url);\n          url.searchParams.set(\n            c.offsetParam\
        \ || \"offset\",\n            String(page * Number(c.pageSize || 100)),\n\
        \          );\n          url.searchParams.set(\n            c.limitParam ||\
        \ \"limit\",\n            String(c.pageSize || 100),\n          );\n     \
        \   } else break;\n        if (page === 1000) throw new Error(\"Pagination\
        \ exceeded 1000 pages\");\n      }\n    } else if (kind === \"stripe\") {\n\
        \      schema = await importStripe(c, write);\n    } else if (kind === \"\
        workos\") {\n      schema = await importWorkos(c, write);\n    } else if (kind\
        \ === \"posthog\") {\n      schema = await importPosthog(c, write);\n    }\
        \ else if (kind === \"neo4j\") {\n      schema = await importNeo4j(c, write);\n\
        \    } else if (kind === \"s3\") {\n      assert(c.key, \"Select an object\
        \ key\");\n      const client = s3(c);\n      try {\n        const result\
        \ = await client.send(\n          new GetObjectCommand({ Bucket: c.bucket,\
        \ Key: c.key }),\n        );\n        assert(result.Body, \"Empty S3 object\"\
        );\n        for await (const chunk of result.Body as any) {\n          if\
        \ (!out.write(chunk)) await once(out, \"drain\");\n          if (Date.now()\
        \ - lastProgress > 1000) {\n            lastProgress = Date.now();\n     \
        \       await progress?.({\n              message: \"Downloading complete\
        \ file\",\n              bytes: out.bytesWritten,\n            });\n     \
        \     }\n        }\n        out.end();\n        await once(out, \"finish\"\
        );\n        await progress?.({\n          message: \"Profiling complete snapshot\"\
        ,\n          bytes: out.bytesWritten,\n        });\n        return { file,\
        \ records: count };\n      } finally {\n        client.destroy();\n      }\n\
        \    } else throw new Error(\"Upload files through the upload endpoint\");\n\
        \    out.end();\n    await once(out, \"finish\");\n    await progress?.({\n\
        \      message: \"Profiling complete snapshot\",\n      records: count,\n\
        \    });\n    return { file, records: count, schema: count === 0 ? schema\
        \ : undefined };\n  } catch (e) {\n    out.destroy();\n    await finished(out).catch(()\
        \ => {});\n    await rm(path, { force: true }).catch(() => {});\n    throw\
        \ e;\n  }\n}\nREVIEWED_EOF\n"
      shell: bash
    - name: Apply reviewed tests/postgres-discovery.test.ts
      run: "cat > tests/postgres-discovery.test.ts <<'REVIEWED_EOF'\nimport { beforeAll,\
        \ afterAll, describe, it, expect } from \"vitest\";\nimport pg from \"pg\"\
        ;\nimport { discover } from \"../apps/api/src/connectors.js\";\nimport { createApp\
        \ } from \"../apps/api/src/app.js\";\nimport { MemoryStore } from \"../apps/api/src/store.js\"\
        ;\n\n// Owned fixture only: never point this suite at an existing/user database.\n\
        describe.runIf(process.env.TEST_POSTGRES_DISCOVERY === \"1\")(\"owned PostgreSQL\
        \ fixture\", () => {\nconst connection = { host: \"127.0.0.1\", port: 5432,\
        \ database: \"proof\", user: \"postgres\", password: \"fixture-only\", tls:\
        \ false };\nconst reader = { ...connection, user: \"foundry_readonly\", password:\
        \ \"fixture-reader\" };\nconst schema = \"proof_owned\";\nconst admin = new\
        \ pg.Pool(connection);\nconst keys = [\n  { table_schema: schema, table_name:\
        \ \"customers\", column_name: \"customer_id\", constraint_type: \"PRIMARY\
        \ KEY\" },\n  { table_schema: schema, table_name: \"orders\", column_name:\
        \ \"order_id\", constraint_type: \"PRIMARY KEY\" },\n  { table_schema: schema,\
        \ table_name: \"orders\", column_name: \"customer_id\", constraint_type: \"\
        FOREIGN KEY\" },\n];\nconst foreignKeys = [{ table_schema: schema, table_name:\
        \ \"orders\", column_name: \"customer_id\", referenced_schema: schema, referenced_table:\
        \ \"customers\", referenced_column: \"customer_id\" }];\nbeforeAll(async ()\
        \ => {\n  console.log(\"Owned PostgreSQL runtime\", (await admin.query(\"\
        SELECT version() AS version\")).rows[0].version);\n  await admin.query(`CREATE\
        \ SCHEMA proof_owned;\n    CREATE TABLE proof_owned.customers(customer_id\
        \ text PRIMARY KEY);\n    CREATE TABLE proof_owned.orders(order_id text PRIMARY\
        \ KEY, customer_id text REFERENCES proof_owned.customers);\n    CREATE TABLE\
        \ proof_owned.hidden(secret_id text PRIMARY KEY);\n    CREATE ROLE foundry_readonly\
        \ LOGIN PASSWORD 'fixture-reader';\n    GRANT CONNECT ON DATABASE proof TO\
        \ foundry_readonly;\n    GRANT USAGE ON SCHEMA proof_owned TO foundry_readonly;\n\
        \    GRANT SELECT ON proof_owned.customers, proof_owned.orders TO foundry_readonly;`);\n\
        });\nbeforeAll(async () => {\n  await admin.query(`CREATE SCHEMA proof_edges;\n\
        \    CREATE SCHEMA proof_other;\n    CREATE TABLE proof_edges.parent(tenant\
        \ text, id text, PRIMARY KEY(tenant,id));\n    CREATE TABLE proof_edges.child(id\
        \ text PRIMARY KEY, owner_id text, owner_tenant text,\n      CONSTRAINT shared_fk\
        \ FOREIGN KEY(owner_tenant,owner_id) REFERENCES proof_edges.parent(tenant,id));\n\
        \    CREATE TABLE proof_edges.solo(id text PRIMARY KEY);\n    CREATE TABLE\
        \ proof_edges.second(id text PRIMARY KEY, solo_id text,\n      CONSTRAINT\
