      run: pnpm test --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/helix-candidate-junit.xml"
        2>&1 | tee "$RUNNER_TEMP/helix-test.log"
      env:
        TEST_POSTGRES_DISCOVERY: '1'
        NODE_ENV: test
        INLINE_WORKER: 'false'
        ENCRYPTION_KEY: owned-proof-encryption-key-32-characters
        INTERNAL_KEY: owned-proof-internal-key-32-characters
        DATA_DIR: /tmp/helix-readonly-owned
      shell: bash
    - name: Required build
      run: pnpm build 2>&1 | tee "$RUNNER_TEMP/helix-build.log"
      shell: bash
    - name: Verify native cases and full suite results
      run: 'python3 - <<''COUNTS''

        import os,pathlib,xml.etree.ElementTree as E,json

        r=E.parse(pathlib.Path(os.environ[''RUNNER_TEMP''],''helix-candidate-junit.xml'')).getroot()

        cases=list(r.iter(''testcase''));native=[x for x in cases if x.attrib.get(''classname'')==''tests/postgres-discovery.test.ts'']

        assert len(native)==9,len(native)

        assert all(x.find(''failure'') is None and x.find(''error'') is None and x.find(''skipped'')
        is None for x in native)

        assert not list(r.iter(''failure'')) and not list(r.iter(''error''))

        result={''allCases'':len(cases),''nativeCases'':len(native),''failures'':0,''errors'':0,''skipped'':len(list(r.iter(''skipped'')))}

        print(result);pathlib.Path(os.environ[''RUNNER_TEMP''],''helix-counts.json'').write_text(json.dumps(result,indent=2))

