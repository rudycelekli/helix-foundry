        proof_edges\",table_name:\"parent\",column_name:\"tenant\",constraint_type:\"\
        PRIMARY KEY\"},\n        {table_schema:\"proof_edges\",table_name:\"parent\"\
        ,column_name:\"id\",constraint_type:\"PRIMARY KEY\"}\n      ]);\n    }\n \
        \ });\n  it(\"does not cross-pair equal FK constraint names on different tables\"\
