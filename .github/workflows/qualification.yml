name: Existing Helix105 owner feedback native qualification
on:
  push:
    branches: [validation/helix105-owner-feedback]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'rudycelekli/helix-foundry' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8a3185735ed7b7740484fbc0cf262c89a59dfda8
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.7.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Freeze Gitblob evidence before dependency installation
        env:
          EXPECTED_HARNESS_HEAD: ${{ github.sha }}
        run: |
          test "$(git -C harness rev-parse HEAD)" = "$EXPECTED_HARNESS_HEAD"
          cd harness
          sha256sum --check <<'HASHES'
          7c73eb509df88be5eeaf14a36900593296ef825c65eaac11a76b22cc92b64879  qualification-runner.mjs
          fe5afbcfbfd2d35901dc606dd6aebc5a624b71dfb1d7fd94116e01af06d2e361  network-guard.mjs
          1cc3aa7132231e45d284fb815358445b692cf97aacdcb2ddc868c5e4c5184eb5  source-guard.mjs
          118d8ce93ca2bbce640e724c88ce1dfee2aaf645c4ac22a2ae1b652881bf34d1  network-guard-selftest.mjs
          df4dddce17ae4cc2f287ed594a0e0b75c6d08d310f9d90f440c551b29360a533  selftest-transport-stub.mjs
          de673b6496055110423248b9b545f6f7943965416cdbdf1235d67f7e4f4a0f81  network-owned-native-smoke.mjs
          HASHES
          cd ..
          node harness/network-guard-selftest.mjs
          node harness/source-guard.mjs create
      - name: Install exact repository dependency lock
        working-directory: candidate
        run: pnpm install --frozen-lockfile
      - name: Install GitHub-owned browser only
        working-directory: candidate
        run: pnpm exec playwright install --with-deps chromium
      - name: Reverify frozen source and harness before execution
        env:
          EXPECTED_HARNESS_HEAD: ${{ github.sha }}
        run: |
          test "$(git -C harness rev-parse HEAD)" = "$EXPECTED_HARNESS_HEAD"
          cd harness
          sha256sum --check <<'HASHES'
          7c73eb509df88be5eeaf14a36900593296ef825c65eaac11a76b22cc92b64879  qualification-runner.mjs
          fe5afbcfbfd2d35901dc606dd6aebc5a624b71dfb1d7fd94116e01af06d2e361  network-guard.mjs
          1cc3aa7132231e45d284fb815358445b692cf97aacdcb2ddc868c5e4c5184eb5  source-guard.mjs
          118d8ce93ca2bbce640e724c88ce1dfee2aaf645c4ac22a2ae1b652881bf34d1  network-guard-selftest.mjs
          df4dddce17ae4cc2f287ed594a0e0b75c6d08d310f9d90f440c551b29360a533  selftest-transport-stub.mjs
          de673b6496055110423248b9b545f6f7943965416cdbdf1235d67f7e4f4a0f81  network-owned-native-smoke.mjs
          HASHES
          cd ..
          node harness/source-guard.mjs verify
      - name: Actual confined transport admission before browser proof
        run: node harness/network-owned-native-smoke.mjs --playwright
      - name: Missing browser gate and red-first placement only
        run: node harness/qualification-runner.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: helix105-owner-feedback-native-proof
          path: proof
          retention-days: 1
          compression-level: 9
