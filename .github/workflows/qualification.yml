name: Existing Helix105 owner feedback native qualification
on:
  push:
    branches: [validation/helix105-owner-feedback]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'rudycelekli/helix-foundry' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8a3185735ed7b7740484fbc0cf262c89a59dfda8
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.7.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Freeze Gitblob evidence before dependency installation
        env:
          EXPECTED_HARNESS_HEAD: ${{ github.sha }}
        run: |
          test "$(git -C harness rev-parse HEAD)" = "$EXPECTED_HARNESS_HEAD"
          cd harness
          sha256sum --check <<'HASHES'
          2df1a94601cb67f8753bb28cfbe0699bfcaa1f37bb5020c245eaec00f4653632  qualification-runner.mjs
          0e1b0303f26e04d7e7ae1e3d3691e9a1969b2b314effd22a8f4e4f913ce7cfbd  network-guard.mjs
          1cc3aa7132231e45d284fb815358445b692cf97aacdcb2ddc868c5e4c5184eb5  source-guard.mjs
          48cf0212c64b46a94fd71b53f0422d5a4dd10aed1ad27de13c83ec8c6382387c  network-guard-selftest.mjs
          df4dddce17ae4cc2f287ed594a0e0b75c6d08d310f9d90f440c551b29360a533  selftest-transport-stub.mjs
          HASHES
          cd ..
          node harness/network-guard-selftest.mjs
          node harness/source-guard.mjs create
      - name: Install exact repository dependency lock
        working-directory: candidate
        run: pnpm install --frozen-lockfile
      - name: Install GitHub-owned browser only
        working-directory: candidate
        run: pnpm exec playwright install --with-deps chromium
      - name: Reverify frozen source and harness before execution
        env:
          EXPECTED_HARNESS_HEAD: ${{ github.sha }}
        run: |
          test "$(git -C harness rev-parse HEAD)" = "$EXPECTED_HARNESS_HEAD"
          cd harness
          sha256sum --check <<'HASHES'
          2df1a94601cb67f8753bb28cfbe0699bfcaa1f37bb5020c245eaec00f4653632  qualification-runner.mjs
          0e1b0303f26e04d7e7ae1e3d3691e9a1969b2b314effd22a8f4e4f913ce7cfbd  network-guard.mjs
          1cc3aa7132231e45d284fb815358445b692cf97aacdcb2ddc868c5e4c5184eb5  source-guard.mjs
          48cf0212c64b46a94fd71b53f0422d5a4dd10aed1ad27de13c83ec8c6382387c  network-guard-selftest.mjs
          df4dddce17ae4cc2f287ed594a0e0b75c6d08d310f9d90f440c551b29360a533  selftest-transport-stub.mjs
          HASHES
          cd ..
          node harness/source-guard.mjs verify
      - name: Required native gates and red-first owner regressions
        run: node harness/qualification-runner.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: helix105-owner-feedback-native-proof
          path: proof
          retention-days: 1
          compression-level: 9
