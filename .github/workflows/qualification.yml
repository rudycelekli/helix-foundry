name: Qualify Helix 105 uncertain promotion cleanup
on: workflow_dispatch
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: HelixDB/helix-foundry
          ref: 52cfaa3ed2bde3fbeeca933fb77be55580a75efb
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Freeze original PR integration payload
        shell: bash
        run: |
          python3 - <<'PYCOMMON'
          import base64,gzip,pathlib,os,hashlib
          data=gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(data).hexdigest()=='8dc84cd682bb5a5da5780f2ba25f277afc9871d54053374f534799900788bd46'
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'helix105-common.patch').write_bytes(data)
          PYCOMMON
      - name: Exact source baseline and candidate native gates
        shell: bash
        run: |
          python3 - <<'PYPROOF'
          import base64,gzip,hashlib,json,os,pathlib,subprocess
          root=pathlib.Path.cwd(); evidence=pathlib.Path(os.environ['RUNNER_TEMP'])/'helix105-proof'; evidence.mkdir(exist_ok=True)
          manifest={'base': '52cfaa3ed2bde3fbeeca933fb77be55580a75efb', 'old_pr_head': 'c2109d8fa06bf378fccd4c554d9de9a1b794c037', 'integrated_old_pr_tree': '2a9a24ac3e1d9f34a9c7b82f7af4d288c73b4ca0', 'files': {'apps/api/src/pipeline-jobs.ts': {'baseline': '3e96667265d0e4d539dac42ddae736e119fd54d04190e83d16f098ca7e80563c', 'candidate': '92558a481e6b8ab19215c9af159a87c0df199b6a4fb77792c39729d8c324ce6d'}, 'tests/pipeline-cancellation.test.ts': {'baseline': 'd11afdbe31181664056927a62c89499521ba8b4a133104f8199372b45da91e54', 'candidate': 'd11afdbe31181664056927a62c89499521ba8b4a133104f8199372b45da91e54'}, 'docs/API.md': {'baseline': '151e305d4c99bc3aa7a9042499cf75587d0f65533c54f1e4cf0dccdbe3222d01', 'candidate': '961626a7fdc23c47b5a1da877991ab8f61d969776c9cc80ff26796b7f16bc653'}, 'docs/OPERATIONS.md': {'baseline': '58aa60a7239e18584ccb9eac5a1ba91de38ba6fe0c52afc41b39daa19d77e0eb', 'candidate': '576e819e0d58a75e3999fc0b0ec07be8e9bb063317d12c8e7e5bdc6ccc8a9948'}}, 'baseline': {'tree': '45d803b01ca296fba0fe4f17088b6f0f057a5bb5', 'patch_sha256': '3fb6636dbe17a314d35777ffb05efd163d1d0dd9262b9329af24a7d9821372d4', 'patch_bytes': 52254}, 'candidate': {'tree': '819c295c0eb1abafb318dd187e1b46aa077ea243', 'patch_sha256': 'abe1d282dee39480ca0905e5a730e3023e114e57a77f960bb555f6c197fdd16f', 'patch_bytes': 53681}}
          patches={'baseline': '', 'candidate': ''}
          (evidence/'manifest.json').write_text(json.dumps(manifest,indent=2))
          def run(args,check=True):return subprocess.run(args,check=check)
          def git(*args):return subprocess.check_output(['git',*args]).decode().strip()
          def hashes():
           return {f:hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest() for f in git('ls-files').splitlines()}
          def apply(mode):
           run(['git','reset','--hard',manifest['base']])
           run(['git','apply','--index',str(pathlib.Path(os.environ['RUNNER_TEMP'])/'helix105-common.patch')])
           data=gzip.decompress(base64.b64decode(patches[mode]))
           path=evidence/(mode+'.patch');path.write_bytes(data);run(['git','apply','--index',str(path)])
           assert git('write-tree')==manifest[mode]['tree'];run(['git','diff','--exit-code'])
           assert hashlib.sha256(subprocess.check_output(['git','diff','--cached','--binary',manifest['base']])).hexdigest()==manifest[mode]['patch_sha256']
           for f,expected in manifest['files'].items():assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==expected[mode]
           before=hashes();(evidence/(mode+'-source-before.json')).write_text(json.dumps(before,sort_keys=True));return before
          def guard(mode,before):
           after=hashes();(evidence/(mode+'-source-after.json')).write_text(json.dumps(after,sort_keys=True));assert before==after;assert git('write-tree')==manifest[mode]['tree'];run(['git','diff','--exit-code'])
           assert hashlib.sha256(subprocess.check_output(['git','diff','--cached','--binary',manifest['base']])).hexdigest()==manifest[mode]['patch_sha256']
          assert git('rev-parse','HEAD')==manifest['base']
          before=apply('baseline')
          run(['pnpm','install','--frozen-lockfile'])
          run(['pnpm','build:sdk'])
          report=evidence/'baseline-native.json'
          result=run(['pnpm','exec','vitest','run','tests/pipeline-cancellation.test.ts','-t','retains a promoted snapshot when its commit response is lost','--reporter=json','--outputFile='+str(report)],False)
          assert result.returncode!=0,'Baseline unexpectedly passed'
          d=json.loads(report.read_text());assert d['numFailedTests']==1 and d['numPassedTests']==0
          failures=[a for suite in d['testResults'] for a in suite['assertionResults'] if a['status']=='failed'];assert len(failures)==1
          failure=failures[0];assert 'retains a promoted snapshot when its commit response is lost' in failure['fullName'];message=' '.join(failure['failureMessages']);assert 'pipeline-cancellation.test.ts:194:' in message and 'include' in message,message; assert pathlib.Path('tests/pipeline-cancellation.test.ts').read_text().splitlines()[193].strip() == 'expect(await files(resolve(root, "datasets", f.scope))).toContain('; assert pathlib.Path('tests/pipeline-cancellation.test.ts').read_text().splitlines()[194].strip() == 'ds.data.activeVersion + ".parquet",'
          (evidence/'baseline-oracle.json').write_text(json.dumps({'expected_missing_promoted_file_failure':True,'failure':failure},indent=2));guard('baseline',before)
          before=apply('candidate')
          run(['pnpm','typecheck'])
          run(['pnpm','test','--reporter=json','--outputFile='+str(evidence/'candidate-full-tests.json')])
          run(['pnpm','build'])
          guard('candidate',before)
          (evidence/'COMPLETED.json').write_text(json.dumps({'baseline_missing_file_failure_verified':True,'candidate_full_required_gates_passed':True,'candidate_tree':manifest['candidate']['tree'],'proof_scope':'Actual whole production runPipelineJob import and actual MemoryStore/transaction, native owned executor Parquet/SDK preview; controlled post-commit apply-then-throw, not actual HelixDB network loss'},indent=2))
          PYPROOF
      - name: Preserve bounded proof receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helix105-native-proof
          path: ${{ runner.temp }}/helix105-proof
          retention-days: 7
